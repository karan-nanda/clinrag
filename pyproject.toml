[project]
name = "clinrag"
version = "0.1.0"
description = "Faithfulness of grounded vs. ungrounded LLM explanations of genomic variants"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
scorer = ["torch", "transformers>=4.40", "scikit-learn>=1.3"]
retrieval = ["rank-bm25>=0.2.2", "sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
